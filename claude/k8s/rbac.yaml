apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-content-api-role
  namespace: ai-content
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-content-api-rolebinding
  namespace: ai-content
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-content-api-role
subjects:
- kind: ServiceAccount
  name: ai-content-api
  namespace: ai-content
---
apiVersion: policy/v1
kind: PodSecurityPolicy
metadata:
  name: ai-content-psp
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
  - ALL
  volumes:
  - 'configMap'
  - 'emptyDir'
  - 'projected'
  - 'secret'
  - 'downwardAPI'
  - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: false