apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-content-config
  namespace: ai-content
data:
  # API Configuration
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  
  # Ollama Configuration
  OLLAMA_HOST: "http://ollama-service:11434"
  OLLAMA_DEFAULT_MODEL: "llama3.1:8b"
  OLLAMA_KEEP_ALIVE: "5m"
  
  # LocalAI Configuration
  LOCALAI_HOST: "http://localai-service"
  LOCALAI_PORT: "8080"
  
  # Performance Configuration
  ENABLE_CACHING: "true"
  ENABLE_BATCHING: "false"
  ENABLE_PROMPT_OPTIMIZATION: "true"
  ENABLE_CONNECTION_POOLING: "true"
  ENABLE_PERFORMANCE_MONITORING: "true"
  
  # Cache Configuration
  CACHE_MAX_SIZE: "5000"
  CACHE_TTL: "3600000"
  
  # Rate Limiting
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "1m"
  
  # CORS
  CORS_ORIGIN: "*"
  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ai-content
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript 
                   application/json application/javascript application/xml+rss;

        # Rate limiting zones
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=generate_limit:10m rate=2r/s;

        # Upstream servers
        upstream api_backend {
            least_conn;
            server api-service:3000 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        # Cache configuration
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m 
                         max_size=1g inactive=60m use_temp_path=off;

        server {
            listen 80;
            server_name _;

            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "no-referrer-when-downgrade" always;

            # API endpoints
            location /api/ {
                limit_req zone=api_limit burst=20 nodelay;
                
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Timeouts
                proxy_connect_timeout 5s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                
                # Buffering
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
                proxy_busy_buffers_size 8k;
                
                # Cache for GET requests
                proxy_cache api_cache;
                proxy_cache_methods GET HEAD;
                proxy_cache_key "$scheme$request_method$host$request_uri";
                proxy_cache_valid 200 1m;
                proxy_cache_valid 404 1m;
                proxy_cache_use_stale error timeout invalid_header updating;
                add_header X-Cache-Status $upstream_cache_status;
            }

            # Generation endpoint (separate rate limit)
            location /api/generate {
                limit_req zone=generate_limit burst=5 nodelay;
                
                proxy_pass http://api_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                
                # Longer timeout for generation
                proxy_connect_timeout 5s;
                proxy_send_timeout 600s;
                proxy_read_timeout 600s;
                
                # No caching for generation
                proxy_cache off;
            }

            # Health check
            location /health {
                proxy_pass http://api_backend;
                access_log off;
            }

            # Metrics endpoint (internal only)
            location /metrics {
                allow 10.0.0.0/8;
                deny all;
                proxy_pass http://api_backend/api/performance/stats;
            }
        }
    }