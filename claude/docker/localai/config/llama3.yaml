name: llama3
backend: llama
parameters:
  model: llama-3.1-8b-instruct-q4_k_m.gguf
  temperature: 0.7
  top_k: 40
  top_p: 0.95
  mmap: true
  f16: true
  threads: 8
  batch: 512
  context_size: 4096
  gpu_layers: 35

template:
  chat: |
    <|begin_of_text|><|start_header_id|>system<|end_header_id|>
    {{.System}}<|eot_id|>
    {{.Input}}
    <|start_header_id|>assistant<|end_header_id|>
  completion: |
    {{.Input}}