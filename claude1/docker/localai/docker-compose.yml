version: '3.8'

services:
  localai:
    image: quay.io/go-skynet/local-ai:latest-gpu-nvidia-cuda-12
    container_name: localai
    restart: unless-stopped
    environment:
      - DEBUG=false
      - MODELS_PATH=/models
      - GALLERIES_JSON=[{"name":"model-gallery","url":"github:go-skynet/model-gallery/index.yaml"}]
      - THREADS=4
      - CONTEXT_SIZE=4096
      - F16=true
    volumes:
      - ./models:/models
      - ./config:/config
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["/usr/bin/local-ai", "--models-path", "/models", "--config-dir", "/config"]

  # CPU-only alternative (comment out GPU version above and uncomment this)
  # localai-cpu:
  #   image: quay.io/go-skynet/local-ai:latest
  #   container_name: localai
  #   restart: unless-stopped
  #   environment:
  #     - DEBUG=false
  #     - MODELS_PATH=/models
  #     - THREADS=8
  #     - CONTEXT_SIZE=4096
  #   volumes:
  #     - ./models:/models
  #     - ./config:/config
  #   ports:
  #     - "8080:8080"